name: collect

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: state-mutate   # 采集与清理都改同一个 state，必须串行
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  gate:
    # GitHub 的 schedule 不可靠（实测 */30 会拖到 4~6 小时），
    # 所以每 10 分钟尝试一次，但距上次成功运行不足 25 分钟就跳过，实际仍是约 30 分钟一次
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      go: ${{ steps.gate.outputs.go }}
    steps:
      - id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "手动触发，直接执行"
            exit 0
          fi
          last=$(gh api "repos/${{ github.repository }}/actions/workflows/collect.yml/runs?per_page=30" \
                  --jq '[.workflow_runs[] | select(.conclusion=="success")][0].created_at // empty' 2>/dev/null || true)
          if [ -z "$last" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "没有历史成功运行，直接执行"
            exit 0
          fi
          minutes=$(( ( $(date +%s) - $(date -d "$last" +%s) ) / 60 ))
          echo "距上次成功运行 ${minutes} 分钟"
          if [ "$minutes" -lt 25 ]; then
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "未满 25 分钟，本轮跳过"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

  collect:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - name: Install dependencies
        run: pip install -r collector/requirements.txt

      - name: Collect
        env:
          # GitHub Release 后端用内置 token，不需要额外密钥
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          BOT_CHAT_ID: ${{ secrets.BOT_CHAT_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
        run: python -m collector.main --config config/

      - name: Build manifest
        run: python scripts/build_manifest.py --state work/state.json --out web/data/manifest.json --limit 500

      - name: Commit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/manifest.json
          if git diff --cached --quiet; then
            echo "manifest 无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: update manifest"
          # 采集期间 state 可能已通过 Contents API 提交，先把远端变更 rebase 上来
          git pull --rebase --autostash origin main
          git push

      - name: Heartbeat
        run: |
          # 公开仓库 60 天无提交会被 GitHub 自动停用定时任务，这里提前补一次提交
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          days=$(( (now - last) / 86400 ))
          echo "最近一次提交：$days 天前"
          if [ "$days" -lt 25 ]; then
            echo "无需心跳"
            exit 0
          fi
          date -u +"%Y-%m-%dT%H:%M:%SZ" > state/heartbeat.txt
          git add state/heartbeat.txt
          git commit -m "chore: heartbeat"
          git pull --rebase --autostash origin main
          git push
          echo "已写入心跳，重置 60 天计时"
