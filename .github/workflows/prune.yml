name: prune

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: state-mutate   # 采集与清理都改同一个 state，必须串行
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - name: Install dependencies
        run: pip install -r collector/requirements.txt

      - name: Prune expired files
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
        run: python -m collector.main --config config/ --prune-only

      - name: Build manifest
        run: python scripts/build_manifest.py --state work/state.json --out web/data/manifest.json --limit 500

      - name: Commit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/manifest.json
          if git diff --cached --quiet; then
            echo "manifest 无变化，跳过提交"
          else
            git commit -m "chore: prune manifest"
            git push
          fi
