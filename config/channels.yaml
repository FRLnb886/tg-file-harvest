channels:
  - id: "LinYuKernel1"          # 频道 username（不带 @）或数字 id
    title: "林羽の小窝（无广）"
    enabled: true
    min_size: 1024
    max_size: 524288000
    # 只采集文件名/描述命中其中任一关键词的文件；留空表示不过滤
    include_keywords: ["LinYuKernel.ver"]
    exclude_keywords: []
    # 只取最新一个匹配文件（追版本），每 30 分钟检查一次是否有更新
    latest_only: true
    # zip 在服务端解压，包内每个文件各自生成直链
    extract_zip: true
